<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị - Bản đồ đường ngang Phường Trường Thi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#0f172a;color:#f8fafc;overflow:hidden}
:focus-visible{outline:2px solid #ffde00;outline-offset:2px}
header{background:linear-gradient(135deg,#990000,#660000);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:1001;border-bottom:2px solid #ffde00}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand>div{min-width:0}
.logo{width:36px;height:36px;object-fit:contain;border-radius:50%;border:1.5px solid #ffde00;background:#fff;flex-shrink:0}
.brand h1{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:.68rem;color:#ffde00}
.actions{display:flex;gap:6px;flex-shrink:0}
.btn{background:#334155;color:#fff;border:1px solid #475569;padding:8px 12px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.save{background:#16a34a;border-color:#4ade80;position:relative}
.btn.save.dirty::after{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:#ffde00;border:2px solid #660000}
.btn.red{background:#990000;border-color:#ffde00}
.btn.danger{background:#7f1d1d;border-color:#ef4444}
.main{display:flex;flex:1;position:relative;overflow:hidden}
.sidebar{position:absolute;top:0;left:0;height:100%;width:85%;max-width:320px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;z-index:1002;transform:translateX(-100%);transition:transform .3s;box-shadow:5px 0 25px rgba(0,0,0,.5)}
.sidebar.open{transform:none}
.sb-h{padding:12px 16px;background:#0f172a;font-size:.82rem;font-weight:600;color:#94a3b8;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
.add{margin:10px 10px 0}
.list{flex:1;overflow-y:auto;padding:10px}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover,.card.sel{border-color:#38bdf8}
.card-t{font-size:.85rem;font-weight:600;margin-bottom:4px}
.card-m{font-size:.72rem;color:#94a3b8;display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.badge{padding:2px 6px;border-radius:4px;font-size:.68rem;font-weight:600;color:#fff;white-space:nowrap}
.toggle{position:absolute;top:15px;left:15px;background:#990000;color:#fff;border:1px solid #ffde00;padding:8px 14px;border-radius:20px;font-weight:600;font-size:.8rem;z-index:1000;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#map{flex:1;height:100%;z-index:1;background:#0f172a}
#map.adding{cursor:crosshair}
.mk{display:flex;justify-content:center;align-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-size:15px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.mk.sel{outline:3px solid #ffde00}
.bg-green{background:#10b981}.bg-red{background:#ef4444}.bg-yellow{background:#f59e0b}
.panel{position:absolute;z-index:1003;right:12px;bottom:12px;width:min(320px,calc(100% - 24px));background:rgba(15,23,42,.97);border:1px solid #475569;border-radius:12px;padding:12px;box-shadow:0 10px 25px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.panel-h{display:flex;justify-content:space-between;align-items:center;color:#38bdf8;font-size:.85rem}
.x{cursor:pointer;padding:4px}
label{font-size:.72rem;color:#94a3b8;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
input,select,textarea{background:#1e293b;color:#f8fafc;border:1px solid #475569;border-radius:6px;padding:8px;font-size:16px;width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px}
.hint{font-size:.7rem;color:#94a3b8;line-height:1.5}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #ffde00;color:#fff;padding:8px 14px;border-radius:20px;font-size:.78rem;z-index:2000;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:12px}
.modal .panel{position:static;width:min(400px,100%);max-height:95%;overflow:auto}
.hidden{display:none!important}
@media(min-width:769px){.sidebar{transform:none;position:relative;width:320px}.toggle{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" class="logo" alt="" onerror="this.style.display='none'">
    <div><h1>Quản trị bản đồ đường ngang</h1><p>Công an Phường Trường Thi</p></div>
  </div>
  <div class="actions">
    <button class="btn" onclick="openCfg()" aria-label="Cấu hình GitHub" title="Cấu hình GitHub"><i class="fa-solid fa-gear"></i></button>
    <button class="btn" onclick="dl()" aria-label="Tải data.json" title="Tải data.json"><i class="fa-solid fa-download"></i></button>
    <button class="btn save" id="btnSave" onclick="save()" title="Lưu lên GitHub"><i class="fa-solid fa-cloud-arrow-up"></i> Lưu</button>
  </div>
</header>

<div class="main">
  <button class="toggle" onclick="toggleSb()"><i class="fa-solid fa-list"></i> Danh sách điểm</button>

  <div class="sidebar" id="sidebar">
    <div class="sb-h">
      <span><i class="fa-solid fa-train-subway"></i> Danh sách điểm (<span id="count">0</span>)</span>
      <i class="fa-solid fa-xmark x" onclick="toggleSb()"></i>
    </div>
    <button class="btn red add" onclick="startAdd()"><i class="fa-solid fa-plus"></i> Thêm điểm mới</button>
    <div class="list" id="list"></div>
  </div>

  <div id="map"></div>

  <div class="panel hidden" id="panel" oninput="edit()">
    <div class="panel-h"><b><i class="fa-solid fa-location-dot"></i> Thông tin điểm</b><i class="fa-solid fa-xmark x" onclick="closePanel()"></i></div>
    <label>Tên<input id="fName"></label>
    <label>Trạng thái
      <select id="fStatus">
        <option value="green">Có gác ghi</option>
        <option value="red">Lối dân tự mở - nguy hiểm</option>
        <option value="yellow">Lối đã được đóng</option>
      </select>
    </label>
    <div class="row">
      <label>Vĩ độ<input id="fLat" type="number" step="any"></label>
      <label>Kinh độ<input id="fLng" type="number" step="any"></label>
    </div>
    <label>Ghi chú<textarea id="fNote" rows="3"></textarea></label>
    <p class="hint">Kéo biểu tượng trên bản đồ để đổi vị trí.</p>
    <button class="btn danger" onclick="del()"><i class="fa-solid fa-trash"></i> Xoá điểm này</button>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<div class="modal hidden" id="cfgModal">
  <div class="panel">
    <div class="panel-h"><b>Cấu hình GitHub</b><i class="fa-solid fa-xmark x" onclick="$('cfgModal').classList.add('hidden')"></i></div>
    <div class="row">
      <label>Tài khoản GitHub<input id="c_owner" autocapitalize="off" autocomplete="off"></label>
      <label>Tên repository<input id="c_repo" autocapitalize="off" autocomplete="off"></label>
    </div>
    <div class="row">
      <label>Nhánh<input id="c_branch" autocapitalize="off"></label>
      <label>File dữ liệu<input id="c_path" autocapitalize="off"></label>
    </div>
    <label>Token (quyền Contents: Read and write)<input id="c_token" type="password" autocomplete="off"></label>
    <p class="hint">Token chỉ lưu trong trình duyệt của thiết bị này, không nằm trong mã nguồn. Chỉ cấp quyền cho đúng repository này và không gửi token cho người khác.</p>
    <button class="btn save" onclick="saveCfg()">Lưu cấu hình</button>
  </div>
</div>

<script>
const ST = {
  green:  { t: 'Có gác ghi',               l: 'CÓ GÁC GHI',        c: '#10b981', i: 'fa-shield-halved',        k: 'bg-green' },
  red:    { t: 'Lối dân tự mở - nguy hiểm', l: 'NGUY HIỂM (TỰ MỞ)', c: '#ef4444', i: 'fa-triangle-exclamation', k: 'bg-red' },
  yellow: { t: 'Lối đã được đóng',          l: 'ĐÃ ĐÓNG',           c: '#f59e0b', i: 'fa-ban',                  k: 'bg-yellow' }
};
const DEFAULT = [
  { id: "1", name: "Đường ngang Km94+250", lat: 20.4425, lng: 106.1850, type: "Có gác ghi", status: "green", note: "Đang mở thông thoáng, nhân viên trực đầy đủ." },
  { id: "2", name: "Lối đi tự mở Km94+800", lat: 20.4350, lng: 106.1770, type: "Lối dân tự mở - nguy hiểm", status: "red", note: "Khu vực khuất tầm nhìn, cần chú ý quan sát kỹ." },
  { id: "3", name: "Đường ngang Điện Biên", lat: 20.4280, lng: 106.1700, type: "Lối đã được đóng", status: "yellow", note: "Đã rào chắn cố định, cấm qua lại." }
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
let data = [], sel = null, dirty = false, adding = false;

const map = L.map('map', { zoomControl: false }).setView([20.381307, 106.135650], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Esri & Công an Phường Trường Thi'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

/* ---------- Cấu hình GitHub (lưu ở trình duyệt của admin) ---------- */
const CK = 'truongthi_gh_cfg';
const cfg = () => { try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch (e) { return {}; } };
const ready = c => c.token && c.owner && c.repo;
const apiUrl = c => `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path || 'data.json'}`;
const hdr = c => ({ Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' });

function openCfg() {
  const c = cfg();
  ['owner', 'repo', 'branch', 'path', 'token'].forEach(k => $('c_' + k).value = c[k] || (k === 'branch' ? 'main' : k === 'path' ? 'data.json' : ''));
  $('cfgModal').classList.remove('hidden');
}
function saveCfg() {
  const c = {};
  ['owner', 'repo', 'branch', 'path', 'token'].forEach(k => c[k] = $('c_' + k).value.trim());
  localStorage.setItem(CK, JSON.stringify(c));
  $('cfgModal').classList.add('hidden');
  toast('Đã lưu cấu hình trên thiết bị này');
}

/* ---------- Tải / lưu dữ liệu ---------- */
async function load() {
  const c = cfg();
  try {
    if (ready(c)) { // đọc thẳng từ GitHub để luôn có bản mới nhất
      const r = await fetch(`${apiUrl(c)}?ref=${c.branch || 'main'}&t=${Date.now()}`, { headers: hdr(c), cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g, '')), x => x.charCodeAt(0))));
      }
    }
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch (e) {}
  return DEFAULT;
}

async function save() {
  const c = cfg();
  if (!ready(c)) { toast('Nhập cấu hình GitHub trước khi lưu'); openCfg(); return; }
  const b = $('btnSave'); b.disabled = true;
  try {
    const u = apiUrl(c), br = c.branch || 'main';
    let sha;
    const g = await fetch(`${u}?ref=${br}&t=${Date.now()}`, { headers: hdr(c), cache: 'no-store' });
    if (g.ok) sha = (await g.json()).sha;
    else if (g.status !== 404) throw new Error((await g.json()).message || g.status);
    let s = ''; new TextEncoder().encode(JSON.stringify(data, null, 2)).forEach(x => s += String.fromCharCode(x));
    const r = await fetch(u, {
      method: 'PUT', headers: hdr(c),
      body: JSON.stringify({ message: 'Cập nhật dữ liệu đường ngang', content: btoa(s), branch: br, sha })
    });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    setDirty(false);
    toast('Đã lưu. Trang người dân cập nhật sau khoảng 1 phút.');
  } catch (e) {
    toast(`Không lưu được (${e.message}). Kiểm tra lại cấu hình GitHub.`);
  }
  b.disabled = false;
}

function dl() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'data.json';
  a.click();
}

/* ---------- Hiển thị ---------- */
function icon(it, on) {
  const s = ST[it.status] || ST.green;
  return L.divIcon({
    className: 'custom-div-icon',
    html: `<div class="mk ${s.k}${on ? ' sel' : ''}"><i class="fa-solid ${s.i}"></i></div>`,
    iconSize: [36, 36], iconAnchor: [18, 18]
  });
}

function render() {
  layer.clearLayers();
  $('list').innerHTML = '';
  data.forEach(it => {
    const s = ST[it.status] || ST.green;
    const d = document.createElement('div');
    d.className = 'card' + (it.id === sel ? ' sel' : '');
    d.onclick = () => { select(it.id, true); if (innerWidth <= 768) toggleSb(); };
    d.innerHTML = `<div class="card-t">${esc(it.name)}</div>
      <div class="card-m"><span style="color:#cbd5e1"><i class="fa-solid fa-train"></i> ${esc(s.t)}</span><span class="badge" style="background:${s.c}">${s.l}</span></div>`;
    $('list').appendChild(d);

    const m = L.marker([it.lat, it.lng], { icon: icon(it, it.id === sel), draggable: true });
    m.on('click', () => select(it.id));
    m.on('dragend', () => {
      const p = m.getLatLng();
      it.lat = +p.lat.toFixed(6); it.lng = +p.lng.toFixed(6);
      setDirty(true);
      if (sel === it.id) fill(it);
    });
    layer.addLayer(m);
  });
  $('count').textContent = data.length;
}

function fill(it) {
  $('fName').value = it.name; $('fStatus').value = it.status;
  $('fLat').value = it.lat; $('fLng').value = it.lng; $('fNote').value = it.note || '';
}
function select(id, pan) {
  const it = data.find(x => x.id === id); if (!it) return;
  sel = id; fill(it);
  $('panel').classList.remove('hidden');
  render();
  if (pan) map.flyTo([it.lat, it.lng], Math.max(map.getZoom(), 16));
}
function closePanel() { sel = null; $('panel').classList.add('hidden'); render(); }

function edit() {
  const it = data.find(x => x.id === sel); if (!it) return;
  it.name = $('fName').value;
  it.status = $('fStatus').value; it.type = ST[it.status].t;
  it.note = $('fNote').value;
  const la = parseFloat($('fLat').value), ln = parseFloat($('fLng').value);
  if (!isNaN(la) && !isNaN(ln)) { it.lat = la; it.lng = ln; }
  setDirty(true); render();
}
function del() {
  const it = data.find(x => x.id === sel);
  if (it && confirm(`Xoá "${it.name}"?`)) {
    data = data.filter(x => x !== it); sel = null;
    $('panel').classList.add('hidden'); setDirty(true); render();
  }
}

/* ---------- Thêm điểm: bấm nút rồi chạm lên bản đồ ---------- */
function startAdd() {
  adding = true; $('map').classList.add('adding');
  $('sidebar').classList.remove('open');
  toast('Chạm vào bản đồ để đặt vị trí điểm mới');
}
map.on('click', e => {
  if (!adding) return;
  adding = false; $('map').classList.remove('adding');
  const it = { id: String(Date.now()), name: 'Đường ngang mới', lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6), type: ST.green.t, status: 'green', note: '' };
  data.push(it); setDirty(true); select(it.id);
  $('fName').focus(); $('fName').select();
});

/* ---------- Tiện ích ---------- */
function setDirty(v) { dirty = v; $('btnSave').classList.toggle('dirty', v); }
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
let tt;
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.remove('hidden');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 4500);
}
function toggleSb() { $('sidebar').classList.toggle('open'); }

load().then(d => { data = Array.isArray(d) ? d : DEFAULT; render(); });
</script>
</body>
</html>
